<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="theme-color" content="#0a0e14">
<title>Lot Calculator — K_TABLE方式</title>
<style>
  :root{
    --bg:#0a0e14;
    --panel:#111721;
    --panel-2:#0d131c;
    --line:#1e2836;
    --ink:#e8eef7;
    --ink-dim:#7d8ba0;
    --ink-faint:#4a5568;
    --accent:#3ddc97;      /* signal green */
    --accent-dim:#1f6b4d;
    --warn:#ffb454;
    --danger:#ff5c6c;
    --mono:'SF Mono','JetBrains Mono','Cascadia Code',ui-monospace,Menlo,Consolas,monospace;
    --sans:'Inter',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{background:var(--bg);color:var(--ink);font-family:var(--sans);-webkit-font-smoothing:antialiased}
  body{min-height:100vh;padding:20px 16px 40px;max-width:520px;margin:0 auto}

  /* header */
  .head{display:flex;align-items:baseline;justify-content:space-between;padding-bottom:18px;border-bottom:1px solid var(--line);margin-bottom:22px}
  .head h1{font-size:15px;font-weight:600;letter-spacing:.02em}
  .head h1 .k{color:var(--accent);font-family:var(--mono)}
  .head .rate{font-family:var(--mono);font-size:12px;color:var(--ink-dim);display:flex;align-items:center;gap:6px}
  .dot{width:6px;height:6px;border-radius:50%;background:var(--ink-faint);flex:none}
  .dot.live{background:var(--accent);box-shadow:0 0 8px var(--accent)}
  .dot.manual{background:var(--warn)}

  /* symbol tabs */
  .symbols{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:22px}
  .sym{background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:12px 6px;text-align:center;cursor:pointer;transition:.14s;position:relative;overflow:hidden}
  .sym:hover{border-color:var(--ink-faint)}
  .sym.on{border-color:var(--accent);background:linear-gradient(180deg,rgba(61,220,151,.10),rgba(61,220,151,.02))}
  .sym .tk{font-family:var(--mono);font-size:13px;font-weight:600;letter-spacing:.02em}
  .sym .nm{font-size:10px;color:var(--ink-dim);margin-top:3px}
  .sym.on .tk{color:var(--accent)}

  /* inputs */
  .field{margin-bottom:16px}
  .field label{display:block;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:7px}
  .field label .hint{text-transform:none;letter-spacing:0;color:var(--ink-faint);font-size:11px}
  .input-wrap{position:relative;display:flex;align-items:center}
  .input-wrap .unit{position:absolute;right:14px;font-family:var(--mono);font-size:13px;color:var(--ink-faint);pointer-events:none}
  input[type=text],input[type=number]{width:100%;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;color:var(--ink);font-family:var(--mono);font-size:19px;padding:14px 46px 14px 14px;outline:none;transition:.14s;-moz-appearance:textfield}
  input::-webkit-outer-spin-button,input::-webkit-inner-spin-button{-webkit-appearance:none}
  input:focus{border-color:var(--accent);background:#0b1017}
  input::placeholder{color:var(--ink-faint)}

  .row2{display:grid;grid-template-columns:1fr 1fr;gap:12px}

  /* rate line */
  .ratebar{display:flex;align-items:center;justify-content:space-between;background:var(--panel-2);border:1px solid var(--line);border-radius:10px;padding:10px 14px;margin-bottom:22px}
  .ratebar .lbl{font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-dim)}
  .ratebar .val{font-family:var(--mono);font-size:14px;color:var(--ink)}
  .ratebar .val input{width:92px;font-size:14px;padding:6px 10px;text-align:right}
  .refresh{background:none;border:1px solid var(--line);color:var(--ink-dim);border-radius:7px;padding:6px 10px;font-size:11px;font-family:var(--mono);cursor:pointer;transition:.14s}
  .refresh:hover{border-color:var(--accent);color:var(--accent)}

  /* result */
  .result{background:linear-gradient(180deg,var(--panel),var(--panel-2));border:1px solid var(--line);border-radius:14px;padding:24px 22px;text-align:center;position:relative}
  .result .cap{font-size:11px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-dim);margin-bottom:6px}
  .lot{font-family:var(--mono);font-size:64px;font-weight:600;line-height:1;letter-spacing:-.02em;color:var(--accent);text-shadow:0 0 30px rgba(61,220,151,.25)}
  .lot.void{color:var(--ink-faint);text-shadow:none;font-size:40px}
  .lot .u{font-size:20px;color:var(--ink-dim);margin-left:8px;text-shadow:none}
  .sub{font-family:var(--mono);font-size:12px;color:var(--ink-dim);margin-top:14px;line-height:1.7}
  .sub b{color:var(--ink);font-weight:600}
  .msg{font-size:12px;color:var(--warn);margin-top:10px;min-height:1em;font-family:var(--mono)}

  .formula{margin-top:22px;padding:14px 16px;background:var(--panel-2);border:1px solid var(--line);border-radius:10px}
  .formula .t{font-size:10px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-faint);margin-bottom:8px}
  .formula .f{font-family:var(--mono);font-size:12px;color:var(--ink-dim);line-height:1.8}
  .formula .f .hl{color:var(--accent)}

  .foot{text-align:center;font-size:11px;color:var(--ink-faint);margin-top:26px;font-family:var(--mono)}

  @media (max-width:360px){ .lot{font-size:52px} }
  @media (prefers-reduced-motion:reduce){ *{transition:none!important} }
</style>
</head>
<body>
  <div class="head">
    <h1>LOT <span class="k">/K_TABLE</span></h1>
    <div class="rate"><span class="dot" id="statusDot"></span><span id="statusTxt">初期化中</span></div>
  </div>

  <div class="symbols" id="symbols"></div>

  <div class="ratebar">
    <span class="lbl">USD/JPY</span>
    <div style="display:flex;align-items:center;gap:10px">
      <span class="val"><input type="number" id="usdjpy" step="0.01" value="162.00"></span>
      <button class="refresh" id="refreshRate">自動取得</button>
    </div>
  </div>

  <div class="field">
    <label>リスク額 <span class="hint">— 1トレードで許容する損失(円)</span></label>
    <div class="input-wrap">
      <input type="number" id="risk" inputmode="numeric" placeholder="50000" value="50000">
      <span class="unit">JPY</span>
    </div>
  </div>

  <div class="field">
    <label>現在値 <span class="hint">— エントリー価格</span></label>
    <div class="input-wrap">
      <input type="number" id="entry" inputmode="decimal" placeholder="例: 4050.00">
      <span class="unit" id="entryUnit">USD</span>
    </div>
  </div>

  <div class="field">
    <label>ロスカット値 <span class="hint">— 損切りを置く価格</span></label>
    <div class="input-wrap">
      <input type="number" id="stop" inputmode="decimal" placeholder="例: 4045.00">
      <span class="unit" id="stopUnit">USD</span>
    </div>
  </div>

  <div class="ratebar" style="margin-top:-6px">
    <span class="lbl">SL幅（自動計算）</span>
    <span class="val" id="slWidth" style="color:var(--accent)">—</span>
  </div>

  <div class="ratebar">
    <span class="lbl">TP価格（RR 1:2）</span>
    <span class="val" id="tpPrice2" style="color:var(--warn);font-family:var(--mono);font-size:15px;font-weight:600">—</span>
  </div>

  <div class="ratebar">
    <span class="lbl">TP価格（RR 1:3）</span>
    <span class="val" id="tpPrice3" style="color:var(--warn);font-family:var(--mono);font-size:15px;font-weight:600">—</span>
  </div>

  <div class="result">
    <div class="cap">推奨ロット</div>
    <div class="lot void" id="lotOut">—</div>
    <div class="sub" id="detail"></div>
    <div class="msg" id="msg"></div>
  </div>

  <div class="formula">
    <div class="t">計算式</div>
    <div class="f">lot = <span class="hl">リスク額</span> ÷ ( <span class="hl">SL幅</span> × <span class="hl">K</span> )<br>
    K は銘柄係数（USD建てはUSD/JPYで補正）</div>
  </div>

  <div class="foot">K_TABLE方式 · オフライン動作可</div>

<script>
// ===== K_TABLE(基準係数) =====
// 実トレード履歴から逆算した銘柄係数。USD建て銘柄は基準レート162前提の値。
// USD/JPY補正: K_adj = K_base × (現在レート / 162)
const BASE_RATE = 162;
const SYMBOLS = [
  {id:'XAUUSD', name:'金',      k:16161.2, usd:true,  slUnit:'USD', dec:2},
  {id:'JP225',  name:'日経',    k:1.0,     usd:false, slUnit:'pt',  dec:0},
  {id:'BTCUSD', name:'BTC',     k:161.71,  usd:true,  slUnit:'USD', dec:2},
  {id:'USDJPY', name:'ドル円',  k:1000,    usd:false, slUnit:'JPY', dec:3, pips:true},
  {id:'EURAUD', name:'ユーロ豪', k:1070,   usd:false, slUnit:'AUD', dec:5, pips:true},
  {id:'GBPAUD', name:'ポンド豪', k:1070,   usd:false, slUnit:'AUD', dec:5, pips:true},
];
// 注: USDJPY/EURAUD/GBPAUDのkは暫定値。実トレードで検算し調整してください。
// EURAUD/GBPAUD: 1lot=10万通貨, 1pipあたり約10.7AUD≈1070JPY(AUD/JPY=100想定)→ K≈1070

let cur = SYMBOLS[0];

const $ = id => document.getElementById(id);
const symbolsEl = $('symbols');
SYMBOLS.forEach((s,i)=>{
  const d=document.createElement('div');
  d.className='sym'+(i===0?' on':'');
  d.innerHTML=`<div class="tk">${s.id}</div><div class="nm">${s.name}</div>`;
  d.onclick=()=>{cur=s;[...symbolsEl.children].forEach(c=>c.classList.remove('on'));d.classList.add('on');
    const u = s.pips ? s.slUnit : s.slUnit;
    $('entryUnit').textContent=u;
    $('stopUnit').textContent=u;
    calc();};
  symbolsEl.appendChild(d);
});

function calc(){
  const risk=parseFloat($('risk').value);
  const entry=parseFloat($('entry').value);
  const stop=parseFloat($('stop').value);
  const rate=parseFloat($('usdjpy').value)||BASE_RATE;
  const out=$('lotOut'),detail=$('detail'),msg=$('msg'),slWidthEl=$('slWidth'),tp2El=$('tpPrice2'),tp3El=$('tpPrice3');
  msg.textContent='';

  // SL幅 = |現在値 - ロスカット値|
  let sl=NaN;
  const isLong = stop < entry;  // 損切りが下 → ロング
  if(entry>0&&stop>0&&entry!==stop){
    sl=Math.abs(entry-stop);
    // SL幅表示
    if(cur.pips) slWidthEl.textContent=(sl*100).toFixed(1)+' pips';
    else slWidthEl.textContent=sl.toFixed(cur.dec)+' '+cur.slUnit;
    // TP価格(RR1:2, RR1:3)
    const tp2 = isLong ? entry + sl*2 : entry - sl*2;
    const tp3 = isLong ? entry + sl*3 : entry - sl*3;
    tp2El.textContent=tp2.toFixed(cur.dec);
    tp3El.textContent=tp3.toFixed(cur.dec);
  }else{
    slWidthEl.textContent='—';
    tp2El.textContent='—';
    tp3El.textContent='—';
  }

  if(!risk||!sl||risk<=0||sl<=0||isNaN(sl)){
    out.textContent='—';out.className='lot void';detail.innerHTML='';return;
  }
  // USD建て銘柄はレート補正
  let k=cur.k;
  if(cur.usd) k = cur.k * (rate/BASE_RATE);

  const lot = risk/(sl*k);
  if(!isFinite(lot)||lot<=0){out.textContent='—';out.className='lot void';return;}

  let disp;
  if(lot>=100) disp=lot.toFixed(1);
  else if(lot>=1) disp=lot.toFixed(2);
  else disp=lot.toFixed(3);

  out.innerHTML=`${disp}<span class="u">lot</span>`;out.className='lot';
  const lossAtSL=(sl*k*parseFloat(disp));
  const profitRR2=(sl*2*k*parseFloat(disp));
  const profitRR3=(sl*3*k*parseFloat(disp));
  const dir = isLong ? 'ロング(買い)' : 'ショート(売り)';
  detail.innerHTML=`${cur.id} · ${dir} · K=<b>${(cur.usd?k:cur.k).toFixed(cur.k<10?4:2)}</b>`+
    `<br>SL到達損失 ≈ <b style="color:var(--danger)">−¥${Math.round(lossAtSL).toLocaleString()}</b>`+
    `<br>TP(1:2)利益 ≈ <b style="color:var(--warn)">+¥${Math.round(profitRR2).toLocaleString()}</b>`+
    `<br>TP(1:3)利益 ≈ <b style="color:var(--accent)">+¥${Math.round(profitRR3).toLocaleString()}</b>`;
  if(lot<0.01) msg.textContent='⚠ 最小ロット(0.01)未満です。リスクを上げるかSLを狭めてください';
}

['risk','entry','stop','usdjpy'].forEach(id=>$(id).addEventListener('input',calc));

// ===== USD/JPY 自動取得(失敗時は手入力にフォールバック) =====
function setStatus(state,txt){
  const dot=$('statusDot');dot.className='dot '+state;$('statusTxt').textContent=txt;
}
async function fetchRate(){
  setStatus('','取得中…');
  const sources=[
    async()=>{const r=await fetch('https://api.frankfurter.app/latest?from=USD&to=JPY');const j=await r.json();return j.rates.JPY;},
    async()=>{const r=await fetch('https://open.er-api.com/v6/latest/USD');const j=await r.json();return j.rates.JPY;},
  ];
  for(const src of sources){
    try{
      const rate=await Promise.race([src(),new Promise((_,rej)=>setTimeout(()=>rej('timeout'),4000))]);
      if(rate&&rate>50&&rate<300){
        $('usdjpy').value=rate.toFixed(2);
        setStatus('live','自動 '+rate.toFixed(2));
        calc();return true;
      }
    }catch(e){/* try next */}
  }
  setStatus('manual','手入力モード');
  return false;
}
$('refreshRate').onclick=fetchRate;
$('usdjpy').addEventListener('input',()=>setStatus('manual','手入力 '+$('usdjpy').value));

// 初回
fetchRate();
calc();
</script>
</body>
</html>
